<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca — Acervo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #f8f6f1;
    --surface:  #ffffff;
    --card:     #ffffff;
    --border:   #e4ddd0;
    --gold:     #a07830;
    --gold-dim: #c9a87a;
    --cream:    #1a1208;
    --muted:    #9a8f80;
    --red:      #c0392b;
    --green:    #1e8449;
    --text:     #2c2416;
    --radius:   6px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1.25rem 2rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--gold); letter-spacing: .03em; }
  .logo span { font-style: italic; }
  .header-stats { display: flex; gap: 2rem; margin-left: auto; }
  .stat { text-align: center; }
  .stat-num { font-family: 'DM Mono', monospace; font-size: 1.4rem; color: var(--gold); }
  .stat-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }

  /* ── Layout ── */
  .main { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 73px); }

  /* ── Sidebar ── */
  aside {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }
  .section-title {
    font-family: 'DM Mono', monospace;
    font-size: .65rem;
    text-transform: uppercase;
    letter-spacing: .15em;
    color: var(--gold-dim);
    margin-bottom: .75rem;
  }
  .search-box { position: relative; }
  .search-box input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: .65rem 1rem;
    font-family: 'DM Sans', sans-serif;
    font-size: .9rem;
    outline: none;
    transition: border-color .2s;
  }
  .search-box input:focus { border-color: var(--gold); }
  .search-type { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .5rem; }
  .pill {
    background: none;
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--muted);
    cursor: pointer;
    font-size: .75rem;
    padding: .25rem .75rem;
    transition: all .2s;
  }
  .pill.active, .pill:hover { border-color: var(--gold); color: var(--gold); }

  .btn {
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: .85rem;
    font-weight: 500;
    padding: .7rem 1.25rem;
    transition: all .2s;
  }
  .btn-gold { background: var(--gold); color: #0f0d0a; }
  .btn-gold:hover { background: #d4b05a; }
  .btn-outline { background: none; border: 1px solid var(--border); color: var(--muted); }
  .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
  .btn-danger { background: none; border: 1px solid transparent; color: var(--muted); font-size: .8rem; }
  .btn-danger:hover { color: var(--red); }
  .btn-full { width: 100%; text-align: center; }

  /* ── Genre filter ── */
  .genre-list { display: flex; flex-direction: column; gap: .3rem; }
  .genre-item {
    background: none;
    border: none;
    border-radius: var(--radius);
    color: var(--muted);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: .85rem;
    padding: .4rem .75rem;
    text-align: left;
    transition: all .15s;
  }
  .genre-item:hover, .genre-item.active { background: var(--card); color: var(--cream); }

  /* ── Content ── */
  .content { padding: 2rem; }
  .toolbar { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; }
  .toolbar h2 { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 400; flex: 1; }
  .result-count { font-family: 'DM Mono', monospace; font-size: .75rem; color: var(--muted); }

  /* ── Grid ── */
  .livros-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.25rem;
  }
  .livro-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: .75rem;
    transition: border-color .2s, transform .15s;
    position: relative;
    overflow: hidden;
  }
  .livro-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: var(--gold);
    opacity: 0;
    transition: opacity .2s;
  }
  .livro-card:hover { border-color: var(--gold-dim); transform: translateY(-2px); }
  .livro-card:hover::before { opacity: 1; }
  .livro-titulo {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    color: var(--cream);
    line-height: 1.3;
  }
  .livro-autor { font-size: .82rem; color: var(--gold); font-style: italic; }
  .livro-meta { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-top: .25rem; }
  .tag {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    font-family: 'DM Mono', monospace;
    font-size: .68rem;
    color: var(--muted);
    padding: .15rem .5rem;
  }
  .badge {
    border-radius: 20px;
    font-size: .68rem;
    font-weight: 500;
    padding: .2rem .65rem;
    margin-left: auto;
  }
  .badge.disponivel { background: rgba(39,174,96,.15); color: var(--green); border: 1px solid rgba(39,174,96,.3); }
  .badge.indisponivel { background: rgba(192,57,43,.15); color: var(--red); border: 1px solid rgba(192,57,43,.3); }
  .livro-actions { display: flex; gap: .5rem; margin-top: .5rem; }
  .btn-sm {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: .75rem;
    padding: .35rem .75rem;
    transition: all .15s;
    background: none;
    color: var(--muted);
  }
  .btn-sm:hover { border-color: var(--gold); color: var(--gold); }
  .btn-sm.red:hover { border-color: var(--red); color: var(--red); }

  /* ── Modal ── */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2.5rem;
    width: 100%;
    max-width: 500px;
    animation: slideUp .25s ease;
  }
  @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    color: var(--cream);
    margin-bottom: 2rem;
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .form-group { display: flex; flex-direction: column; gap: .4rem; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label {
    font-family: 'DM Mono', monospace;
    font-size: .68rem;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--muted);
  }
  .form-group input, .form-group select {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: .9rem;
    outline: none;
    padding: .6rem .9rem;
    transition: border-color .2s;
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--gold); }
  .form-group select option { background: var(--surface); }
  .modal-actions { display: flex; justify-content: flex-end; gap: .75rem; margin-top: 2rem; }
  .error-msg { color: var(--red); font-size: .8rem; margin-top: .25rem; display: none; }
  .error-msg.show { display: block; }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 5rem 2rem;
    color: var(--muted);
    grid-column: 1/-1;
  }
  .empty-icon { font-size: 3rem; margin-bottom: 1rem; opacity: .4; }
  .empty h3 { font-family: 'Playfair Display', serif; font-size: 1.2rem; margin-bottom: .5rem; color: var(--text); }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 2rem; right: 2rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: .85rem 1.5rem;
    font-size: .85rem;
    transform: translateX(200%);
    transition: transform .3s ease;
    z-index: 999;
    max-width: 300px;
  }
  #toast.show { transform: translateX(0); }
  #toast.success { border-left: 3px solid var(--green); }
  #toast.error { border-left: 3px solid var(--red); }

  .divider { border: none; border-top: 1px solid var(--border); }
</style>
</head>
<body>

<header>
  <div class="logo">📚 Biblio<span>teca</span></div>
  <div class="header-stats">
    <div class="stat">
      <div class="stat-num" id="stat-total">—</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-disp">—</div>
      <div class="stat-label">Disponíveis</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-indisp">—</div>
      <div class="stat-label">Emprestados</div>
    </div>
  </div>
</header>

<div class="main">
  <aside>
    <div>
      <div class="section-title">Buscar</div>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Pesquisar..." oninput="buscar()">
      </div>
      <div class="search-type">
        <button class="pill active" onclick="setTipo('titulo', this)">Título</button>
        <button class="pill" onclick="setTipo('autor', this)">Autor</button>
        <button class="pill" onclick="setTipo('genero', this)">Gênero</button>
      </div>
    </div>

    <hr class="divider">

    <div>
      <div class="section-title">Filtrar</div>
      <div class="genre-list" id="genre-list">
        <button class="genre-item active" onclick="filtrarGenero(null, this)">Todos os gêneros</button>
      </div>
    </div>

    <div style="margin-top:auto">
      <button class="btn btn-gold btn-full" onclick="abrirModal()">+ Novo Livro</button>
    </div>
  </aside>

  <main class="content">
    <div class="toolbar">
      <h2>Acervo</h2>
      <span class="result-count" id="result-count"></span>
    </div>
    <div class="livros-grid" id="livros-grid">
      <div class="empty"><div class="empty-icon">📖</div><p>Carregando...</p></div>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="fecharSeBackground(event)">
  <div class="modal">
    <div class="modal-title" id="modal-title">Novo Livro</div>
    <div class="form-grid">
      <div class="form-group full">
        <label>Título *</label>
        <input type="text" id="f-titulo" placeholder="Ex: Dom Casmurro">
        <span class="error-msg" id="err-titulo"></span>
      </div>
      <div class="form-group full">
        <label>Autor *</label>
        <input type="text" id="f-autor" placeholder="Ex: Machado de Assis">
      </div>
      <div class="form-group">
        <label>ISBN *</label>
        <input type="text" id="f-isbn" placeholder="978-00-000-0000-0">
      </div>
      <div class="form-group">
        <label>Ano de Publicação *</label>
        <input type="number" id="f-ano" placeholder="Ex: 1899" min="1" max="2100">
      </div>
      <div class="form-group">
        <label>Gênero</label>
        <input type="text" id="f-genero" placeholder="Ex: Romance">
      </div>
      <div class="form-group">
        <label>Disponibilidade</label>
        <select id="f-disp">
          <option value="true">Disponível</option>
          <option value="false">Emprestado</option>
        </select>
      </div>
    </div>
    <div class="error-msg show" id="err-geral" style="margin-top:.5rem"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-gold" onclick="salvarLivro()">Salvar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = '/api';
let editandoId = null;
let tipoBusca = 'titulo';
let generoAtivo = null;
let todosLivros = [];

// ── Init ──────────────────────────────────────────────────────────────────
window.onload = () => { carregarTudo(); };

async function carregarTudo() {
  await Promise.all([carregarLivros(), carregarStats(), carregarGeneros()]);
}

async function carregarLivros() {
  try {
    const r = await fetch(`${API}/livros`);
    todosLivros = await r.json();
    renderizarLivros(todosLivros);
  } catch { toast('Erro ao carregar livros', 'error'); }
}

async function carregarStats() {
  try {
    const r = await fetch(`${API}/stats`);
    const s = await r.json();
    document.getElementById('stat-total').textContent = s.total;
    document.getElementById('stat-disp').textContent = s.disponiveis;
    document.getElementById('stat-indisp').textContent = s.indisponiveis;
  } catch {}
}

async function carregarGeneros() {
  try {
    const r = await fetch(`${API}/stats`);
    const s = await r.json();
    const list = document.getElementById('genre-list');
    list.innerHTML = '<button class="genre-item active" onclick="filtrarGenero(null, this)">Todos os gêneros</button>';
    s.generos.forEach(g => {
      const b = document.createElement('button');
      b.className = 'genre-item';
      b.textContent = g;
      b.onclick = () => filtrarGenero(g, b);
      list.appendChild(b);
    });
  } catch {}
}

// ── Render ───────────────────────────────────────────────────────────────
function renderizarLivros(livros) {
  const grid = document.getElementById('livros-grid');
  document.getElementById('result-count').textContent = `${livros.length} livro${livros.length !== 1 ? 's' : ''}`;
  if (!livros.length) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><h3>Nenhum livro encontrado</h3><p>Tente outros termos ou adicione um novo livro.</p></div>`;
    return;
  }
  grid.innerHTML = livros.map(l => `
    <div class="livro-card" id="card-${l.id}">
      <div class="livro-titulo">${esc(l.titulo)}</div>
      <div class="livro-autor">${esc(l.autor)}</div>
      <div class="livro-meta">
        <span class="tag">${l.anoPublicacao}</span>
        ${l.genero ? `<span class="tag">${esc(l.genero)}</span>` : ''}
        <span class="badge ${l.disponivel ? 'disponivel' : 'indisponivel'}">${l.disponivel ? 'Disponível' : 'Emprestado'}</span>
      </div>
      <div style="font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted)">${esc(l.isbn)}</div>
      <div class="livro-actions">
        <button class="btn-sm" onclick="editarLivro(${l.id})">Editar</button>
        <button class="btn-sm" onclick="toggleDisp(${l.id})">${l.disponivel ? 'Emprestar' : 'Devolver'}</button>
        <button class="btn-sm red" onclick="deletarLivro(${l.id})">Remover</button>
      </div>
    </div>`).join('');
}

// ── Busca / Filtros ───────────────────────────────────────────────────────
function setTipo(tipo, btn) {
  tipoBusca = tipo;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  buscar();
}

async function buscar() {
  const termo = document.getElementById('search-input').value.trim();
  if (!termo) { renderizarLivros(todosLivros); return; }
  try {
    const r = await fetch(`${API}/livros?busca=${encodeURIComponent(termo)}&tipo=${tipoBusca}`);
    renderizarLivros(await r.json());
  } catch { toast('Erro na busca', 'error'); }
}

function filtrarGenero(genero, btn) {
  generoAtivo = genero;
  document.querySelectorAll('.genre-item').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (!genero) { renderizarLivros(todosLivros); return; }
  renderizarLivros(todosLivros.filter(l => l.genero === genero));
}

// ── CRUD ─────────────────────────────────────────────────────────────────
function abrirModal(livro = null) {
  editandoId = livro ? livro.id : null;
  document.getElementById('modal-title').textContent = livro ? 'Editar Livro' : 'Novo Livro';
  document.getElementById('f-titulo').value = livro?.titulo || '';
  document.getElementById('f-autor').value  = livro?.autor  || '';
  document.getElementById('f-isbn').value   = livro?.isbn   || '';
  document.getElementById('f-genero').value = livro?.genero || '';
  document.getElementById('f-ano').value    = livro?.anoPublicacao || '';
  document.getElementById('f-disp').value   = livro ? String(livro.disponivel) : 'true';
  document.getElementById('err-geral').textContent = '';
  document.getElementById('overlay').classList.add('open');
}

function fecharModal() { document.getElementById('overlay').classList.remove('open'); }
function fecharSeBackground(e) { if (e.target.id === 'overlay') fecharModal(); }

async function salvarLivro() {
  const payload = {
    titulo: document.getElementById('f-titulo').value.trim(),
    autor:  document.getElementById('f-autor').value.trim(),
    isbn:   document.getElementById('f-isbn').value.trim(),
    genero: document.getElementById('f-genero').value.trim(),
    anoPublicacao: parseInt(document.getElementById('f-ano').value) || 0,
    disponivel: document.getElementById('f-disp').value === 'true',
  };
  const errEl = document.getElementById('err-geral');
  errEl.textContent = '';
  try {
    const url    = editandoId ? `${API}/livros/${editandoId}` : `${API}/livros`;
    const method = editandoId ? 'PUT' : 'POST';
    const r = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const data = await r.json();
    if (!r.ok) { errEl.textContent = data.erro || 'Erro ao salvar'; return; }
    fecharModal();
    toast(editandoId ? 'Livro atualizado!' : 'Livro adicionado!', 'success');
    await carregarTudo();
  } catch { errEl.textContent = 'Erro de conexão'; }
}

async function editarLivro(id) {
  try {
    const r = await fetch(`${API}/livros/${id}`);
    abrirModal(await r.json());
  } catch { toast('Erro ao carregar livro', 'error'); }
}

async function deletarLivro(id) {
  if (!confirm('Tem certeza que deseja remover este livro?')) return;
  try {
    const r = await fetch(`${API}/livros/${id}`, { method: 'DELETE' });
    if (r.ok) { toast('Livro removido!', 'success'); await carregarTudo(); }
    else toast('Erro ao remover', 'error');
  } catch { toast('Erro de conexão', 'error'); }
}

async function toggleDisp(id) {
  try {
    const r = await fetch(`${API}/livros/${id}/disponibilidade`, { method: 'PATCH' });
    if (r.ok) { toast('Disponibilidade alterada!', 'success'); await carregarTudo(); }
    else toast('Erro ao alterar', 'error');
  } catch { toast('Erro de conexão', 'error'); }
}

// ── Utils ─────────────────────────────────────────────────────────────────
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

let toastTimer;
function toast(msg, tipo = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${tipo}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });
</script>
</body>
</html>
